statement:
  title: État XP
  close: Fermer
  scope: 'Seulement les réservations d''économie conservées : la revue conserve 2,000 entrées sur ce serveur. Les entrées
    plus anciennes et la vanille XP changements sont absents; les entrées non sauvées peuvent être perdues dans un accident.
    Ces totaux ne sont pas votre solde ou un relevé de compte complet.'
  period: 'Période de roulement (UTC): {from} à {until}'
  total: 'Réservations de {count}: entrées de {incoming} XP, sorties de {outgoing} XP, nettes de {net} XP'
  row: '{cause}: {count} réservations, +{incoming} / -{outgoing} XP, net {net} XP'
  empty: Aucune réservation conservée durant cette période.
  days: Les {days} derniers jours
  export: Exporter cet instantané
  back: Retour au compte
  exported: Déclaration enregistrée sous {file} dans le dossier des exportations du plugin. Demandez à un administrateur le
    fichier. Remplace votre déclaration précédente pour cette période.
  usage: 'Utilisation /economy statement [1|7|30], /economy statement summary [1|7|30] ou /economy statement export [1|7|30].
    Par défaut: 7 jours.'
  summary-scope: 'Les {days} derniers jours: réservation économique réservée (journal du serveur: 2,000 entrées). Les réservations
    plus anciennes et la vanille XP changements peuvent être absents; ce n''est pas votre équilibre.'

