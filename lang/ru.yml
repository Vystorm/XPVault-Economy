  summary-one: <green>Пока тебя не было, {players} заплатили тебе <yellow>{amount}</yellow>.
commands:
  money:
    description: Показать баланс XP (или другого игрока)
    aliases: []
    usage: '[PLAYER]'
  pay:
    description: Оплатить игроку XP очков
    aliases: []
    usage: PLAYER XP
  baltop:
    description: XP таблицы лидеров всех учетных записей
    aliases: []
    usage: '[PAGE]'
