# Русский — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
currency:
  singular: Точка XP
  plural: XP баллов
common:
  no-permission: <red>У тебя нет на это разрешения.
  unknown-account: Этот аккаунт игрока пока не известен.
  players-only: <red>Эту команду могут использовать только игроки.
  usage: '<gray>Использование: <yellow>{usage}'
goal:
  usage: <yellow>Использовать /economy goal [show|set <XP> [label]|clear|notify <on|off>].
  default-label: Цель экономии
  none: <gray>Цель экономии не установлена. Использовать /economy goal set <XP> [label].
  progress: '<gold>{label}: {current} / {target} ({percent}%) · уведомление {notify}'
  set: <green>Сберегательный гол {label} установлен на {target}. При этом не зарезервировано XP.
  cleared: <gray>Цель экономии прояснилась.
  bad-target: <red>Выберите цель XP от 1 до {max}.
  notify-usage: <yellow>Использовать /economy goal notify <on|off>.
  notify-on: <green>Уведомление о цели включено. Если цель уже достигнута, вы будете уведомлены сейчас.
  notify-off: <gray>Уведомление о цели отключено.
  notify-on-short: включено
  notify-off-short: выключено
  reached: '<green>Достигнута цель экономии: {label} ({target}).'
favorite:
  usage: <yellow>Использовать /economy favorite [list|add <player>|remove <player>]. вплоть до 20 получатели.
  empty: <gray>У вас нет спасенных получателей. Добавить один с /economy favorite add <player>.
  header: '<gold>Спасенные получатели:'
  entry: <yellow>{index}. {name}
  added: <green>{name} сэкономлено в качестве получателя. Выберите их в панели счетов или трансферном диалоге; оплата по-прежнему
    требует подтверждения.
  removed: <gray>{name} списаны со сэкономленных средств.
  limit: <red>Вы можете сэкономить максимум {limit} получателей.
  not-saved: <gray>{name} не является сэкономленным получателем.
  choose: Оплата {name}
  choose-hover: Нажмите, чтобы заполнить эту форму; еще не отправлено XP.
button:
  account: Счет
  account-hover: 'Нажмите: Откройте свой аккаунт XP'
