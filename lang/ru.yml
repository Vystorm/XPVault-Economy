  web-hover: 'Нажмите: откройте свою учетную запись XP в браузере (или наложение с клиентом Vystorm)'
balance:
  console-usage: '<red>Консоль: /economy balance <player>'
  line: <gold>{player} имеет номер {amount}.
reward:
  status-afk: Онлайн-бонус остановился из-за бездействия. Участок {streak} сохраняется, деятельность возобновляется.
