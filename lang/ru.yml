statement:
  title: Заявление XP
  close: Закрыть
  scope: 'Только сохраненные экономичные бронирования: журнал хранит {max} записей на этом сервере. Старые записи и изменения
    ванили XP отсутствуют; несохраненные записи могут быть потеряны при аварии. Эти суммы не являются вашим балансом или полным
    отчетом о счете.'
  period: 'Период проката (UTC): от {from} до {until}'
  total: '{count} бронирований: входящие {incoming} XP, исходящие {outgoing} XP, нетто {net} XP'
  row: '{cause}: {count} бронирования, +{incoming} / -{outgoing} XP, нетто {net} XP'
  empty: Никаких бронирований в этот период не сохранилось.
  days: Последние {days} дней
  export: Экспортировать этот снимок
  back: Назад к аккаунту
  exported: Заявление сохранено как {file} в экспортной папке плагина. Попросите администратора для файла. Замените предыдущее
    заявление на этот период.
  usage: 'Использовать /economy statement [1|7|30], /economy statement summary [1|7|30] или /economy statement export [1|7|30].
    по умолчанию: 7 дни.'
  summary-scope: 'Последние {days} дней: только сохраненное экономичное бронирование (серверный журнал: {max} записей). Старые
    бронирования и изменения ванили XP могут отсутствовать; это не ваш баланс.'

