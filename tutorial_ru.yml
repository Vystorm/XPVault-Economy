title: XPVaultEconomy
permission: xpeconomy.balance
pages:
- title: XP в качестве денег
  text: |
    XPVaultEconomy становится реальным Minecraft XP Vault денежных знаков: 1 Единица денег — это 1 XP point. Пока вы находитесь в Интернете, ваш баланс синхронизируется с баром опыта каждую секунду и сохраняется навсегда.

    1. Собрать или потерять XP как обычно.
    2. Откройте свой аккаунт в меню Vystorm: /vmenu → Экономика → XP Счет (or /economy). В чате: /money, /bal или /economy balance.
    3. Когда вы впервые присоединяетесь, реальный XP Вы уже приняли на свой счет.
    4. Лимит по умолчанию является 2,000,000,000 XP Точки; конфигурация сервера может изменять имя валюты и лимит.
- title: Ваш баланс и другие
  text: |
    1. Тип /money или /bal Чтобы увидеть свой баланс.
    2. Альтернативно: /economy balance.
    3. Еще один известный аккаунт игрока: /money <player> или /economy balance <player>.
    4. Для проверки других счетов требуется xpeconomy.balance.others. Без этого вы видите только свой собственный баланс.
- title: Платить игрокам с XP
  permission: xpeconomy.pay
  text: |
    Платежи двигаются реально XP Очки между известными аккаунтами игроков.

    1. Открыть /vmenu → Экономика → XP Учетная запись и выбор "Отправить XP".
    2. Введите игрока и сумму, нажмите «Продолжить» и подтвердите оплату.
    3. Командование: /pay <player> <XP points> (e.g. /pay Alex 250) или /economy pay.
    4. Сумма должна быть положительным целым числом. Вы не можете заплатить себе. Получатель должен уже иметь известный счет; если что-то не удается, частичный платеж не сохраняется.
- title: Онлайн бонус
  text: |
    По умолчанию онлайн-бонус платит XP после каждой полной минуты онлайн. Первая выплата составляет 2 XP; каждая завершенная минута увеличивает следующую выплату на 2 %.

    1. Оставайтесь онлайн для 60 секунды.
    2. По умолчанию выплата отображается в строке действия.
    3. The XP в меню Vystorm и /money show Ваша серия, следующая выплата и оставшееся время.
    4. Если ты вернешься внутрь 30 минуты, ваша полоса, начатая минута и дробная XP сохранены. Эти по умолчанию могут быть изменены на сервере; бонус также может быть отключен.
- title: XP лидеров
  permission: xpeconomy.top
  text: |
    В таблице лидеров показаны счета с наибольшим количеством XP баллы: ранг, имя, баланс и уровень.

    1. Тип /baltop (также /moneytop, /xptop или /economy top).
    2. Просмотреть с /baltop <page> или [Next »] и [« Back] кнопки.
    3. Если вы не находитесь на странице, «Ваш рейтинг» показывает вашу позицию. В этом XP «Лидерборд» открывает тот же список, что и диалог.
    4. Онлайн-игроки рассчитывают на текущий XP. Список кэшируется кратко (30 seconds by default) и поэтому может немного отставать.
- title: Управление экономикой
  permission: xpeconomy.admin
  text: |
    Администраторы управляют известными счетами /economy admin.

    1. /economy admin info показывает количество учетных записей и используемое хранилище. Установите стартовый баланс, валюту, онлайн-бонус и таблицу лидеров /vsettings → сервер → XP Экономика; /economy admin reload Перезагрузка config.yml и языковых файлов.
    2. /economy admin give <player> <XP points> добавлять XP.
    3. /economy admin take <player> <XP points> удалять XP.
    4. /economy admin set <player> <XP points> устанавливает баланс. Суммы являются неотрицательными целыми числами и не должны превышать лимит счета.
